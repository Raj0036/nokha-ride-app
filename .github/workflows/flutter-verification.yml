name: Flutter verification

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check MSG91 Auth Hook
        run: deno check supabase/functions/send-sms/index.ts

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build QA APK
        run: flutter build apk --debug

      - name: Upload QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nokha-ride-qa-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
